[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "todoist-cli"
version = "0.1.1"
description = "JSON-first CLI wrapper and local automation layer for Todoist."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jonas Rombach"}]
keywords = ["todoist", "cli", "automation", "tasks", "json"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Utilities",
]
dependencies = [
  "todoist-api-python>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6",
  "twine>=5.0",
  "mypy>=1.10",
]

[project.scripts]
todoist-cli = "todoist_cli.cli:main"
todoist = "todoist_cli.cli:main"

[project.urls]
Homepage = "https://github.com/jonasrombach/todoist-cli"
Repository = "https://github.com/jonasrombach/todoist-cli"
Issues = "https://github.com/jonasrombach/todoist-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/todoist_cli"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
